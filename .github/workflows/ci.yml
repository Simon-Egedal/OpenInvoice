name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openinvoice_test
          POSTGRES_USER: openinvoice_test
          POSTGRES_PASSWORD: verification-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openinvoice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://openinvoice_test:verification-only@127.0.0.1:5432/openinvoice_test
      TEST_DATABASE_URL: postgresql+asyncpg://openinvoice_test:verification-only@127.0.0.1:5432/openinvoice_test
      APP_CONFIG_PATH: /tmp/openinvoice-ci/settings.enc
      FRONTEND_URL: http://127.0.0.1:13000
      LOCAL_STORAGE_PATH: /tmp/openinvoice-ci/files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m alembic upgrade head && python -m pytest -q
        working-directory: backend
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare browser database
        run: |
          PGPASSWORD=verification-only psql -h 127.0.0.1 -U openinvoice_test -d openinvoice_test -c 'CREATE DATABASE openinvoice_e2e'
          DATABASE_URL=postgresql+asyncpg://openinvoice_test:verification-only@127.0.0.1:5432/openinvoice_e2e python -m alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://openinvoice_test:verification-only@127.0.0.1:5432/openinvoice_e2e python tests/seed_e2e.py
        working-directory: backend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          DATABASE_URL: postgresql+asyncpg://openinvoice_test:verification-only@127.0.0.1:5432/openinvoice_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
